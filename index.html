<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f08a24">
<title>學習遊戲平台</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2b2b;--mute:#777;--pri:#f08a24;--ok:#2e9e5b;--bad:#d9453d;--line:#e8dcc6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a15;--card:#2a261f;--ink:#f3ece0;--mute:#a99f8e;--pri:#f5a34a;--ok:#4cc17f;--bad:#f06a62;--line:#3d372c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a15;--card:#2a261f;--ink:#f3ece0;--mute:#a99f8e;--pri:#f5a34a;--ok:#4cc17f;--bad:#f06a62;--line:#3d372c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:22px;margin:8px 0}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700;min-height:48px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.45}
.game{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:18px}
.game b{display:block;font-size:22px;margin-bottom:4px}.game span{color:var(--mute);font-size:15px;font-weight:400}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .sp{flex:1}
.q{font-size:44px;text-align:center;margin:18px 0;font-weight:700;word-break:break-all}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts button{background:var(--card);color:var(--ink);border:3px solid var(--line);font-size:32px;padding:18px 8px;min-height:84px}
.opts button.ok{border-color:var(--ok);background:var(--ok);color:#fff}.opts button.bad{border-color:var(--bad);background:var(--bad);color:#fff}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:3/4;border-radius:14px;border:3px solid var(--line);background:var(--pri);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;word-break:break-all}
.mc.up{background:var(--card);color:var(--ink)}.mc.done{background:var(--ok);color:#fff;border-color:var(--ok)}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.item span{flex:1}
.item button{min-height:36px;padding:4px 12px}
.big{font-size:56px;text-align:center;font-weight:800;color:var(--pri);margin:8px 0;letter-spacing:6px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--line);margin:3px;font-size:16px}
.msg{text-align:center;color:var(--mute);margin:10px 0}
.sb{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}.sc{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:10px;font-size:12px;padding:2px;text-align:center;overflow:hidden;line-height:1.2}.sc.l{border-color:var(--ok)}.sc.s{border-color:var(--bad)}.sc .tk{font-size:18px;display:block}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}
:root{--c1:#fdf3d6;--c2:#e8f1e4}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#3a3626;--c2:#243229}}:root[data-theme="dark"]{--c1:#3a3626;--c2:#243229}
#sn_names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:12px 0}
.nrow{display:flex;align-items:center;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
#sn_game{display:none;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px}
@media (max-width:760px){#sn_game{grid-template-columns:1fr}}
#sn svg{width:100%;height:auto;display:block;border-radius:10px}
#sn_turn{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sn_dice{width:64px;height:64px;border-radius:12px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;margin:8px 0}
#sn_players{list-style:none;margin:10px 0;padding:0;max-height:230px;overflow:auto}
#sn_players li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;font-size:14px}
#sn_players li.cur{background:var(--c1);font-weight:700}
#sn_players .pos{margin-left:auto;color:var(--mute)}
#sn_log{font-size:13px;color:var(--mute);max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
#sn_log div{padding:1px 0}
#sn_win{display:none;margin-top:10px;padding:12px;border-radius:10px;background:var(--c2);font-weight:700;text-align:center}
.snr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sn_end{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center;padding:16px}
#sn_end .box{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center}
#sn_end h2{margin:0 0 6px;font-size:24px}
#sn_end h2.lose{color:#c0392b;font-size:20px;margin-top:14px}
#sn_endlist{list-style:none;margin:10px 0;padding:0;text-align:left}
#sn_endlist li{display:flex;gap:8px;align-items:center;padding:4px 6px;font-size:14px}
#sn .snr button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
#sn_q .q{font-size:30px;margin:8px 0}#sn_q .opts button{font-size:26px;min-height:64px;padding:10px 6px}
#sn_log{max-height:150px}
.sbg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:12px}@media(max-width:760px){.sbg{grid-template-columns:1fr}}
.sbg svg{width:100%;height:auto;display:block;border-radius:10px}
.sbl{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}.sbl li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;font-size:15px}.sbl li.cur{background:var(--c1);font-weight:700}.sbl .ps{margin-left:auto;color:var(--mute)}
.sbd{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sbm{color:var(--mute);font-size:15px;min-height:24px}.sbdice{font-size:36px;font-weight:800;margin:0 8px}
#sqb.card{margin-bottom:10px}#sqb .q{font-size:34px;margin:6px 0}
.zy{display:inline-flex;align-items:center;margin:0 1px}.zc{font-size:1.45em;line-height:1}
.zb{display:inline-flex;align-items:center;height:2.9em;font-size:.5em;line-height:.95;font-weight:500;margin-left:1px;opacity:.9}
.zs{position:relative;display:flex;flex-direction:column;align-items:center;padding-right:.7em}.zs i{font-style:normal;display:block;line-height:.95}.zs i.zq{line-height:.6}
.zt{position:absolute;right:0;bottom:.4em;line-height:1}
#sm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.smc{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:20px;max-width:560px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.smc .q{font-size:44px;margin:12px 0}.sbbig{font-size:84px;font-weight:800;line-height:1.1;margin:6px 0}
.sbw,.sbf{width:min(100%,calc((100vh - 130px)*0.9375));margin-left:auto;margin-right:auto}
.sbw svg{width:100%;height:auto;display:block;border-radius:10px;border:2px solid var(--line)}
#app:has(.sbw){max-width:1100px}
.sbf{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:8px}
.sbleg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:flex-end;font-size:15px;flex:1}
.sbn{display:inline-flex;align-items:center;gap:5px}.sbn.cur{font-weight:800}.sbn.cur .sbd{outline:2px solid var(--ink);outline-offset:1px}
#rb{--bg:#f4efe4;--card:#fffaf0;--ink:#2b2a26;--mut:#7a7466;--bd:#d8cfb8;--ac:#2f6f5e;--bad:#b33a2e;color-scheme:light}
@media(prefers-color-scheme:dark){#rb{--bg:#1d1f1c;--card:#282b27;--ink:#ece7da;--mut:#a39d8c;--bd:#444840;--ac:#5fb59c;--bad:#e2705f;color-scheme:dark}}
#rb *{box-sizing:border-box}
#rb{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans TC","PingFang TC",sans-serif}
#rb{max-width:920px;margin:0 auto;padding:14px}
#rb h1{font-size:22px;margin:4px 0 2px}
#rb h2{font-size:17px;margin:14px 0 6px}
#rb .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
#rb .grid{display:grid;gap:10px}
#rb .g2{grid-template-columns:1fr 1fr}
#rb .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){#rb .g2{grid-template-columns:1fr}}
#rb button{font:inherit;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
#rb button.sec{background:transparent;color:var(--ac)}
#rb button:disabled{opacity:.45;cursor:not-allowed}
#rb .stat{text-align:center}
#rb .stat b{display:block;font-size:22px}
#rb .mut{color:var(--mut);font-size:13px}
#rb .act{cursor:pointer;text-align:left;color:var(--ink);background:var(--card);border:2px solid var(--bd);width:100%}
#rb .act:hover:not(:disabled){border-color:var(--ac)}
#rb .act.pick{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
#rb .warn{color:var(--bad);font-size:13px}
#rb img.pic{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:6px;background:var(--bd)}
#rb .ph{height:60px;border-radius:8px;background:var(--bd);margin-bottom:6px}
#rb input[type=text],#rb input[type=number],#rb textarea,#rb select{width:100%;font:inherit;padding:4px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink)}
#rb .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#rb .row label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;width:64px}
#rb .log{white-space:pre-wrap;margin:0}
#rb .hide{display:none}
#rb .big{font-size:42px;text-align:center}
#rb .stage{display:grid;gap:10px;margin-top:10px;grid-template-columns:110px 1fr 1fr;grid-template-areas:"hp hp ev" "res scene ev" "act act ev"}
#rb #heartRow{font-size:22px;letter-spacing:2px;line-height:1.3}
#rb .side{display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center}
#rb .side span{font-size:28px}
#rb .side b{display:block;font-size:22px}
#rb .scene{text-align:center}
#rb .hero{font-size:54px;line-height:1}
#rb .plat{height:16px;margin:2px auto 8px;width:70%;border-radius:50%;background:repeating-linear-gradient(135deg,var(--ink) 0 2px,var(--card) 2px 6px)}
#rb .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
@media(max-width:700px){#rb .stage{grid-template-columns:1fr 1fr;grid-template-areas:"hp hp" "res scene" "ev ev" "act act"}
#rb .acts{grid-template-columns:1fr}}
#rb .beach{position:relative;overflow:hidden;border-radius:14px;margin-top:10px;padding:16px;min-height:520px;color:#1b1b1b;color-scheme:light;
 background:radial-gradient(ellipse at 12% 6%,#dfe6ef 0 12%,transparent 30%),radial-gradient(ellipse at 70% 10%,#eaf0f3 0 8%,transparent 22%),linear-gradient(#e4edf1,#f4f1bd 65%,#f3e9a6);
 display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hud evt" "acts evt" "next evt";gap:10px 24px;align-content:start}
#rb .beach::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:#5fa8b5;z-index:0}
#rb .deco{position:absolute;right:0;bottom:0;width:54%;max-width:460px;z-index:1;pointer-events:none}
#rb .hud,#rb .evt,#rb .acts,#rb .nextwrap{position:relative;z-index:2}
#rb .hud{grid-area:hud}
#rb .evt{grid-area:evt;align-self:start}
#rb .acts{grid-area:acts;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
#rb .nextwrap{grid-area:next}
#rb .pill{display:inline-block;background:#c8cfdb;border-radius:26px;padding:8px 22px;font-size:30px;font-weight:700;line-height:1.2;margin-bottom:6px}
#rb .ico{font-size:22px;line-height:1.3;margin:2px 0;word-break:break-all}
#rb .ico .dim,#rb .beach .dim{opacity:.55;font-size:14px}
#rb .evt h3{font-size:28px;margin:6px 0 12px}
#rb .evt .en{font-size:18px;font-weight:700}
#rb .evt div{margin:2px 0}
#rb .evt .es{font-size:13px;color:#444}
#rb .beach .act{background:#c8cfdb;border:2px solid #111;border-radius:22px;min-height:200px;padding:14px;color:#111;display:block}
#rb .beach .act b{font-size:20px}
#rb .beach .act .mut{color:#333}
#rb .beach .act:hover:not(:disabled){border-color:#2f6f5e}
#rb .beach .act.pick{background:#9fb0cc;opacity:1}
#rb .beach .act:disabled{opacity:.7}
#rb .beach .act.pick:disabled{opacity:1}
@media(max-width:700px){#rb .beach{grid-template-columns:1fr;grid-template-areas:"hud" "evt" "acts" "next";min-height:0;padding-bottom:150px}
#rb .acts{grid-template-columns:1fr 1fr}
#rb .deco{width:75%;opacity:.9}}
#rb .row>*{flex:none}#rb button{min-height:0;font-weight:400}#rb .big{color:inherit;letter-spacing:0;font-weight:400}#rb .pill{margin:0 0 6px}
#rb .rbtop{margin-bottom:6px}#rb{border-radius:14px}#app:has(#rb){max-width:960px}

</style>

<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
/* ===== 題庫（所有遊戲共用）===== */
var SEED=[["ㄇㄚ","媽"],["ㄉㄚˋ","大"],["ㄏㄠˇ","好"],["ㄕㄨㄟˇ","水"],["ㄖˋ","日"],["ㄩㄝˋ","月"],["ㄏㄨㄛˇ","火"],["ㄖㄣˊ","人"],["ㄕㄢ","山"],["ㄎㄡˇ","口"]];
var bank=[];
function loadBank(){try{var s=localStorage.getItem("bank_v1");if(s){bank=JSON.parse(s)}}catch(e){}
  if(!bank.length){bank=SEED.map(function(x){return{q:x[0],a:x[1]}})}}
function saveBank(){try{localStorage.setItem("bank_v1",JSON.stringify(bank))}catch(e){}}
loadBank();

var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mk(item){ // 產生 4 選 1：先用題目自訂的錯誤選項，空白的再用其他題的答案補滿
  var seen={},o=[];seen[item.a]=1;
  (item.w||[]).forEach(function(w){w=String(w||"").trim();if(w&&!seen[w]&&o.length<3){seen[w]=1;o.push(w)}});
  shuf(bank.map(function(x){return x.a})).forEach(function(w){if(!seen[w]&&o.length<3){seen[w]=1;o.push(w)}});
  return{q:item.q,a:item.a,opts:shuf(o.concat([item.a]))}}
var app=$("#app"),cleanup=null;
function go(fn,a){if(cleanup){try{cleanup()}catch(e){}cleanup=null}fn(a)}
function topbar(title){return '<div class="top"><button class="ghost" id="back">← 主畫面</button><div class="sp"></div><b>'+title+'</b></div>'}
function bindBack(){var b=$("#back");if(b)b.onclick=function(){go(home)}}

/* ===== 身分、統計 ===== */
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
var role=ls("role_v1"),sname=ls("name_v1")||"";
function addStat(g,n,sc,t){var a=[];try{a=JSON.parse(ls("stats_v1")||"[]")}catch(e){}a.push({n:n,g:g,s:sc,t:t,d:Date.now()});if(a.length>1000)a=a.slice(-1000);ls("stats_v1",JSON.stringify(a))}
function addWrong(n,q,a,c){var w=[];try{w=JSON.parse(ls("wrong_v1")||"[]")}catch(e){}w.push({n:n,q:q,a:a,c:c,d:Date.now()});if(w.length>200)w=w.slice(-200);ls("wrong_v1",JSON.stringify(w))}
function setRole(r){role=r;ls("role_v1",r)}

/* ===== 首頁（選身分）===== */
function roleSel(){
  app.innerHTML='<h1>🎒 學習遊戲平台</h1><p class="sub">請選擇身分</p><div class="grid"><button class="game" id="rt"><b>👩‍🏫 老師</b><span>房間代碼、題庫、分數統計</span></button><button class="game" id="rs"><b>🧒 學生</b><span>玩遊戲</span></button></div>'+
  '<div class="card" id="nmbox" style="display:none;margin-top:12px"><b>你的名字</b><div style="height:8px"></div><input id="nmi" maxlength="8" placeholder="輸入名字" value="'+esc(sname)+'"><button id="ok" style="width:100%;margin-top:8px">開始</button></div>';
  $("#rt").onclick=function(){setRole("teacher");go(home)};
  $("#rs").onclick=function(){$("#nmbox").style.display="";$("#nmi").focus()};
  $("#ok").onclick=function(){var n=$("#nmi").value.trim();if(!n)return;sname=n;ls("name_v1",n);setRole("student");go(home)};
}
function switchBtn(){return '<button class="ghost" id="zt">注音：'+(zon?"開":"關")+'</button><button class="ghost" id="sw">切換身分</button>'}
function bindSwitch(){$("#sw").onclick=function(){role=null;ls("role_v1","");go(roleSel)};$("#zt").onclick=function(){zon=!zon;ls("zy_v1",zon?"1":"0");go(home)}}

/* ===== 主畫面 ===== */
function home(){
  if(!role){roleSel();return}
  if(role==="teacher"){
    app.innerHTML='<div class="top"><h1 style="margin:0">👩‍🏫 老師</h1><div class="sp"></div>'+switchBtn()+'</div><p class="sub">題庫共 '+bank.length+' 題・所有遊戲共用</p>'+
    '<div class="grid"><button class="game" id="th"><b>🏠 房間代碼</b><span>開房間，讓學生用房號加入（選擇題搶答、蛇棋）</span></button>'+
    '<button class="game" id="tb"><b>📚 題庫</b><span>新增、刪除、匯入題目</span></button>'+
    '<button class="game" id="ts"><b>📊 分數統計</b><span>每位學生的成績紀錄</span></button></div>';
    bindSwitch();$("#th").onclick=function(){go(host)};$("#tb").onclick=function(){go(bankEd)};$("#ts").onclick=function(){go(statsView)};
    return;
  }
  app.innerHTML='<div class="top"><h1 style="margin:0">🧒 '+nz(sname)+'</h1><div class="sp"></div>'+switchBtn()+'</div><h2>遊戲</h2><div class="grid">'+
  '<button class="game" id="g1"><b>🎯 選擇題挑戰</b><span>看題目，選出正確答案</span></button>'+
  '<button class="game" id="g2"><b>🃏 翻牌配對</b><span>把題目和答案配成一對</span></button>'+
  '<button class="game" id="g4"><b>🏝️ 魯濱遜漂流記</b><span>單人卡牌生存，活過 14 回合</span></button>'+
  '<button class="game" id="gj"><b>🙋 多人連線</b><span>輸入老師的房號加入（選擇題搶答、蛇棋）</span></button></div>';
  bindSwitch();

function quiz(){

  var qs=shuf(bank).slice(0,10).map(mk),i=0,score=0,lock=false;
  function show(){
    if(i>=qs.length){addStat("quiz",sname||"本機",score,qs.length);app.innerHTML=topbar("🎯 結果")+'<div class="big">'+score+' / '+qs.length+'</div><p class="msg">'+(score===qs.length?"太棒了！全對！🎉":"繼續加油！")+'</p><div class="row"><button id="again">再玩一次</button></div>';bindBack();$("#again").onclick=function(){go(quiz)};return}
    var q=qs[i];lock=false;

    bindBack();

function memory(){
  if(bank.length<2){app.innerHTML=topbar("🃏")+'<p class="msg">題庫至少要 2 題。</p>';bindBack();return}
  var pick=shuf(bank).slice(0,6),cards=[];
  pick.forEach(function(p,k){cards.push({k:k,t:p.q});cards.push({k:k,t:p.a})});
  cards=shuf(cards);var open=[],found=0,moves=0,busy=false;
  function draw(){
    app.innerHTML=topbar("🃏 翻牌配對・"+moves+" 步")+'<div class="mem">'+cards.map(function(c,i){var cl=c.done?"mc done":(open.indexOf(i)>=0?"mc up":"mc");return '<button class="'+cl+'" data-i="'+i+'">'+((c.done||open.indexOf(i)>=0)?esc(c.t):"？")+'</button>'}).join("")+'</div>'+(found===pick.length?'<p class="msg">🎉 全部配對成功！</p><div class="row"><button id="again">再玩一次</button></div>':"");
    bindBack();var a=$("#again");if(a)a.onclick=function(){go(memory)};

  }

}

const DEFAULT_EVENTS=[{"title":"風平浪靜","desc":"海面平靜,你在潮間帶找到一些食物。","food":1,"wood":0,"hp":0,"shelter":false,"img":""},{"title":"小雨","desc":"冰冷的雨水淋濕了你。","food":0,"wood":0,"hp":-1,"shelter":true,"img":""},{"title":"海鳥群","desc":"海鳥在岸邊留下許多鳥蛋。","food":2,"wood":0,"hp":0,"shelter":false,"img":""},{"title":"野豬出沒","desc":"野豬衝進營地!","food":0,"wood":0,"hp":-1,"shelter":true,"img":""},{"title":"暴風雨","desc":"暴風雨吹走部分木頭,並造成傷害。","food":0,"wood":-1,"hp":-1,"shelter":true,"img":""},{"title":"寒冷夜晚","desc":"你靠著篝火熬過寒夜,平安無事。","food":0,"wood":0,"hp":0,"shelter":false,"img":""},{"title":"食物腐壞","desc":"高溫讓存糧腐壞了。","food":-1,"wood":0,"hp":0,"shelter":false,"img":""},{"title":"野獸襲擊","desc":"野獸在夜裡襲擊營地。","food":0,"wood":0,"hp":-1,"shelter":true,"img":""},{"title":"海浪沖走","desc":"大浪沖走了一些木頭。","food":0,"wood":-1,"hp":0,"shelter":false,"img":""},{"title":"毒蟲叮咬","desc":"毒蟲無孔不入,避難所也擋不住。","food":0,"wood":0,"hp":-1,"shelter":false,"img":""},{"title":"晴朗的一天","desc":"天氣晴朗,沒有特別的事發生。","food":0,"wood":0,"hp":0,"shelter":false,"img":""},{"title":"漂流木","desc":"潮水帶來大量漂流木。","food":0,"wood":2,"hp":0,"shelter":false,"img":""},{"title":"猛烈暴風雨","desc":"最猛烈的暴風雨來襲!","food":0,"wood":0,"hp":-2,"shelter":true,"img":""},{"title":"最後一夜","desc":"漫長的最後一夜,平安度過。","food":0,"wood":0,"hp":0,"shelter":false,"img":""}];
function newState(){return{hp:CONFIG.maxHp,food:0,wood:0,lv:0,uses:0,max:0}}
// 結算一回合,回傳 {s,log,dead}
function playRound(s,action,event){
 s={...s};const log=[];
 // 行動
 let ok=true;
 if(action.build){const cost=-action.wood;
  if(s.lv!==action.build-1){ok=false;log.push(`行動失敗:需先建造 Lv.${action.build-1}(目前 Lv.${s.lv})`)}
  else if(s.wood<cost){ok=false;log.push(`行動失敗:木頭不足(需要 ${cost},目前 ${s.wood}),未扣除木頭`)}}
 else if(action.wood<0&&s.wood<-action.wood){ok=false;log.push(`行動失敗:木頭不足(需要 ${-action.wood},目前 ${s.wood}),未扣除木頭`)}
 if(ok){
  s.food+=action.food;s.wood+=action.wood;s.hp=Math.min(CONFIG.maxHp,s.hp+action.hp);
  const p=[];if(action.food)p.push(`${action.food>0?'+':''}${action.food}🍖`);if(action.wood)p.push(`${action.wood>0?'+':''}${action.wood}🪵`);if(action.hp)p.push(`${action.hp>0?'+':''}${action.hp}❤️`);
  log.push(`行動「${action.title}」:${p.join(' ')||'無變化'}`);
  if(action.build){const L=CONFIG.shelter[action.build-1];const add=L.uses-s.max;s.lv=action.build;s.max=L.uses;s.uses+=add;log.push(`建造 Lv.${s.lv} ${L.name},避難所 ${s.uses} / ${s.max}`)}
 }
 if(s.hp<=0)return{s,log,dead:true};
 // 事件
 s.food=Math.max(0,s.food+event.food);s.wood=Math.max(0,s.wood+event.wood);
 const p=[];if(event.food)p.push(`${event.food>0?'+':''}${event.food}🍖`);if(event.wood)p.push(`${event.wood>0?'+':''}${event.wood}🪵`);
 let dmg=-event.hp;
 if(event.hp>0){s.hp=Math.min(CONFIG.maxHp,s.hp+event.hp);p.push(`+${event.hp}❤️`)}
 else if(dmg>0){let ab=0;
  if(event.shelter&&s.uses>0){ab=Math.min(dmg,s.uses);s.uses-=ab;log.push(`🏕️ 避難所抵銷 ${ab} ❤️ 傷害(消耗 ${ab} 次,剩餘 ${s.uses} / ${s.max})`)}
  else if(event.shelter)log.push(`🏕️ 避難所已無使用次數,無法抵銷`);
  else log.push(`此事件傷害無法由避難所抵銷`);
  s.hp-=dmg-ab;if(dmg-ab>0)p.push(`-${dmg-ab}❤️`)}
 log.push(`事件「${event.title}」:${p.join(' ')||'無資源變化'}`);
 if(s.hp<=0)return{s,log,dead:true};
 // 食物消耗
 if(s.food>0){s.food--;log.push(`食物消耗:-1🍖`)}else{s.hp--;log.push(`食物不足:-1❤️(避難所無法抵銷)`)}
 return{s,log,dead:s.hp<=0};
}
function simulate(actions,events){
 let win=0;const total=2**CONFIG.rounds;
 (function go(r,s){
  if(r===CONFIG.rounds){win++;return}
  for(let i=0;i<2;i++){const o=playRound(s,actions[r][i],events[r]);if(!o.dead)go(r+1,o.s)}
 })(0,newState());
 return{win,total,rate:win/total};
}
function strategies(actions,events){ // 固定策略結果
 const run=pick=>{let s=newState();for(let r=0;r<CONFIG.rounds;r++){const o=playRound(s,actions[r][pick(r,s)],events[r]);s=o.s;if(o.dead)return`失敗於第${r+1}回合`}return"勝利"};
 return{全選A:run(()=>0),全選B:run(()=>1),
  食物優先:run((r)=>actions[r][0].food>=actions[r][1].food?0:1),
  木頭優先:run((r)=>actions[r][0].wood>=actions[r][1].wood?0:1),
  能建就建:run((r,s)=>actions[r][1].build&&s.lv===actions[r][1].build-1&&s.wood>=-actions[r][1].wood?1:(actions[r][0].food>=actions[r][1].food?0:1))};
}

/* ===== 多人連線：Supabase Realtime（Broadcast + Presence，訪客匿名，不需登入）===== */
var roomApi=null,myId=(window.crypto&&crypto.randomUUID?crypto.randomUUID():"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
function getRoom(cb){
  if(roomApi){cb(roomApi);return}
  var C=window.GAME_CONFIG||{};window.__roomErr="";
  if(!C.SUPABASE_URL||!C.SUPABASE_KEY){window.__roomErr="config.js 沒有載入或沒有填入設定";cb(null);return}
  if(!window.supabase||!supabase.createClient){window.__roomErr="supabase.js 沒有載入";cb(null);return}
  var client;
  try{client=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:30}}})}catch(e){window.__roomErr="createClient 失敗："+e.message;cb(null);return}
  roomApi={join:function(name){return new Promise(function(res,rej){
    var ch=client.channel("room-"+name,{config:{broadcast:{self:false,ack:false},presence:{key:myId}}}),
        handlers={},peerFns=[],ok=false,tm=null;
    ch.on("broadcast",{event:"m"},function(p){var d=p&&p.payload;if(!d||!d.t)return;(handlers[d.t]||[]).slice().forEach(function(f){try{f({data:d.d,peer:d.f})}catch(e){console.error(e)}})});
    ch.on("presence",{event:"sync"},function(){
      var st=ch.presenceState(),peers=[];
      Object.keys(st).forEach(function(k){var arr=st[k]||[],pr=arr[arr.length-1]||{};peers.push({peer:k,presence:pr,sameTab:k===myId})});
      peerFns.slice().forEach(function(f){try{f({peers:peers})}catch(e){console.error(e)}})});
    var room={
      emit:function(t,d){return ch.send({type:"broadcast",event:"m",payload:{t:t,d:d,f:myId}})},
      on:function(t,f){(handlers[t]=handlers[t]||[]).push(f);return function(){handlers[t]=(handlers[t]||[]).filter(function(x){return x!==f})}},
      onPeers:function(f){peerFns.push(f);return function(){peerFns=peerFns.filter(function(x){return x!==f})}},
      presence:function(o){setTimeout(function(){try{ch.track(o)}catch(e){}},Math.random()*2000)}, // 錯開加入時間，避免多人同時加入超過速率限制
      leave:function(){try{ch.unsubscribe()}catch(e){}}};
    tm=setTimeout(function(){if(!ok){try{ch.unsubscribe()}catch(e){}rej(new Error("timeout"))}},10000);
    ch.subscribe(function(status,err){
      if(status==="SUBSCRIBED"&&!ok){ok=true;clearTimeout(tm);res(room)}
      else if(!ok&&(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED")){clearTimeout(tm);rej(new Error(status+(err&&err.message?"："+err.message:"")))}});
  })}};
  cb(roomApi);
}
function noRoom(e){var C=window.GAME_CONFIG||{},why=window.__roomErr||(e&&e.message)||"連線失敗";
  app.innerHTML=topbar("多人連線")+'<p class="msg">目前無法連線。請確認網路，或請老師檢查網站的連線設定。單人遊戲仍可使用。</p><div class="card nz" style="font-size:13px;word-break:break-all;color:var(--mute)">診斷資訊（給老師看）<br>原因：'+esc(why)+'<br>網址：'+esc(C.SUPABASE_URL||"（空）")+'<br>金鑰長度：'+esc(String((C.SUPABASE_KEY||"").length))+'，開頭：'+esc((C.SUPABASE_KEY||"").slice(0,16))+'</div>';bindBack()}

function host(){
  getRoom(function(R){
    if(!R){noRoom();return}
    var code=String(Math.floor(1000+Math.random()*9000)),rm=null,players={},live={},mode="lobby",scores={},cur=null,answers={},n=0,unsub=[],ended=false;
    cleanup=function(){unsub.forEach(function(f){try{f()}catch(e){}});if(rm)try{rm.leave()}catch(e){}};
    R.join("g"+code).then(function(r){rm=r;
      unsub.push(rm.onPeers(function(ch){
        players={};live={};(ch.peers||[]).forEach(function(p){var pr=p.presence||{};if(pr.role==="p"&&pr.name){players[p.peer]=pr.name;live[p.peer]=1}});
        if(mode==="lobby")lobby()}));
      unsub.push(rm.on("ans",function(m){if(!cur||!m.data||m.data.n!==n||answers[m.peer]!==undefined)return;
        answers[m.peer]={c:m.data.c,name:players[m.peer]||m.data.name||"?"};
        var cnt=Object.keys(answers).length;var e=$("#cnt");if(e)e.textContent=cnt+" / "+Object.keys(players).length+" 已作答"}));
      lobby();
    }).catch(function(e){noRoom(e)});
    function lobby(){
      var names=Object.keys(players).map(function(k){return players[k]});
      app.innerHTML=topbar("👩‍🏫 主持")+'<p class="msg">請學生輸入房號</p><div class="big">'+code+'</div><div class="card"><b>已加入（'+names.length+'）</b><br>'+names.map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join("")+'</div><div class="row"><button id="start" '+(names.length&&bank.length>=4?"":"disabled")+'>選擇題搶答（10 題）</button><button id="sstart" '+(names.length&&bank.length>=4?"":"disabled")+'>🐍 蛇棋</button></div>'+(bank.length<4?'<p class="msg">題庫至少要 4 題</p>':"");
      bindBack();$("#start").onclick=function(){mode="quiz";scores={};n=0;ask(shuf(bank).slice(0,10).map(mk))};$("#sstart").onclick=startSnake;
    }
    function ask(qs){
      if(n>=qs.length){finish();return}
      cur=qs[n];answers={};
      rm.emit("q",{n:n,q:cur.q,opts:cur.opts,total:qs.length});
      app.innerHTML=topbar("第 "+(n+1)+" / "+qs.length+" 題")+'<div class="q">'+esc(cur.q)+'</div><p class="msg" id="cnt">0 / '+Object.keys(players).length+' 已作答</p><div class="row"><button id="rev">公布答案</button></div>';
      bindBack();
      $("#rev").onclick=function(){
        Object.keys(answers).forEach(function(k){if(answers[k].c===cur.a)scores[answers[k].name]=(scores[answers[k].name]||0)+1});
        rm.emit("rev",{n:n,a:cur.a,scores:scores});
        app.innerHTML=topbar("答案")+'<div class="q">'+esc(cur.q)+' → <span style="color:var(--ok)">'+esc(cur.a)+'</span></div>'+board()+'<div class="row"><button id="nx">'+(n+1>=qs.length?"看最終排行":"下一題")+'</button></div>';
        bindBack();$("#nx").onclick=function(){n++;ask(qs)};
        var wr=Object.keys(answers).filter(function(k){return answers[k].c!==cur.a});
        wr.forEach(function(k){addWrong(answers[k].name,cur.q,cur.a,answers[k].c)});
        if(wr.length){SB.modal('<div style="font-size:28px;font-weight:700;margin:6px 0">❌ 答錯的同學（'+wr.length+'）</div><div class="q" style="font-size:36px">'+esc(cur.q)+'</div><div style="margin-bottom:8px">正確答案：'+nz(cur.a)+'</div>'+wr.map(function(k){return '<div style="padding:4px 0;border-bottom:1px solid var(--line)">'+nz(answers[k].name)+' 選了 '+nz(answers[k].c)+'</div>'}).join("")+'<div class="row" style="margin-top:10px"><button id="wk">繼續</button></div>',"w");$("#wk").onclick=function(){SB.modal()}}
      };
    }
    function board(){var arr=Object.keys(players).map(function(k){return players[k]});var seen={};arr=arr.filter(function(x){if(seen[x])return false;seen[x]=1;return true});
      arr.sort(function(a,b){return(scores[b]||0)-(scores[a]||0)});
      return '<div class="card"><table>'+arr.map(function(x,i){return '<tr><td>'+(i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1))+'</td><td>'+nz(x)+'</td><td>'+(scores[x]||0)+'</td></tr>'}).join("")+'</table></div>'}
    function finish(){cur=null;var sn={};Object.keys(players).forEach(function(k){var nm=players[k];if(!sn[nm]){sn[nm]=1;addStat("quiz",nm,scores[nm]||0,10)}});rm.emit("end",{scores:scores});app.innerHTML=topbar("🏆 最終排行")+board()+'<div class="row"><button id="again">再玩一局</button></div>';bindBack();$("#again").onclick=function(){go(host)}}

    function startSnake(){
      mode="snake";
      var P=Object.keys(players).map(function(k){return{peer:k,name:players[k],pos:0}}),dup={};
      P.forEach(function(x){dup[x.name]=(dup[x.name]||0)+1;if(dup[x.name]>1)x.name+=dup[x.name]});
      var c=0,busy=false,over=false,d=0,q=null,qn=0,w="";
      app.innerHTML=topbar("🐍 蛇棋（主持）")+SB.ui('<button class="ghost" id="sk">跳過此人</button>');
      bindBack();var tg=SB.draw($("#sv"));
      function sync(skip){SB.show(tg,P,c,over);if(skip)return;rm.emit("sst",{p:P.map(function(x){return[x.peer,x.name,x.pos]}),c:c,o:over?1:0,d:d,w:w})}
      function next(){c=(c+1)%P.length;setTimeout(turn,1500)}
      function turn(){
        if(over)return;
        var k=0;while(k<P.length&&!live[P[c].peer]){c=(c+1)%P.length;k++}
        if(k>=P.length){SB.modal('<div style="font-size:24px">目前沒有連線的玩家</div>',"r");sync();return}
        busy=false;d=0;q=mk(bank[Math.floor(Math.random()*bank.length)]);qn++;
        rm.emit("sq",{n:qn,who:P[c].peer,name:P[c].name,q:q.q,opts:q.opts});
        sync();SB.modal(SB.qH(P[c].name,q,true),"q");
      }
      unsub.push(rm.on("ans",function(m){
        if(mode!=="snake"||over||busy||!q||!m.data||m.data.g!=="s"||m.data.n!==qn||m.peer!==P[c].peer)return;
        busy=true;var ok=m.data.c===q.a,qa=q.a,qt=q.q,who=P[c].name;q=null;
        rm.emit("sr",{n:qn,ok:ok?1:0,a:qa});
        if(ok){SB.modal(SB.res(true,qa),"r");setTimeout(roll,900)}
        else{addWrong(who,qt,m.data.c,qa);SB.modal(SB.wrongH(who,qt,m.data.c,qa),"w");$("#wk").onclick=function(){SB.modal();next()}}
      }));
      async function roll(){
        var pl=P[c],dd=1+Math.floor(Math.random()*6);d=dd;sync();SB.modal(SB.diceH(pl.name,dd),"d");
        var stp=0,won=await SB.move(pl,dd,function(m){sync(!!(++stp%4));var e=document.getElementById("sdm");if(e&&m)e.textContent=m});
        d=0;
        if(won){over=true;w=pl.name;P.forEach(function(x){addStat("snake",x.name,x===pl?1:0,1)});sync();SB.modal(SB.winH(pl.name,true),"w");$("#ag").onclick=function(){go(host)};return}
        sync();SB.modal();
        if(dd===6)setTimeout(turn,1500);else next();
      }
      $("#sk").onclick=function(){if(over||busy)return;busy=true;q=null;qn++;SB.modal();next()};
      sync();turn();
    }
  });
}

function join(){
  getRoom(function(R){
    if(!R){noRoom();return}
    app.innerHTML=topbar("🙋 加入房間")+'<div class="card"><input id="rc" inputmode="numeric" placeholder="房號（4 位數）" maxlength="4"><div style="height:8px"></div><input id="nm" placeholder="你的名字" maxlength="8" value="'+esc(sname)+'"><div style="height:12px"></div><button id="go" style="width:100%">加入</button></div>';
    bindBack();
    $("#go").onclick=function(){
      var code=$("#rc").value.trim(),name=$("#nm").value.trim();if(!/^\d{4}$/.test(code)||!name)return;
      var rm=null,unsub=[],myName=name,score=0;
      cleanup=function(){unsub.forEach(function(f){try{f()}catch(e){}});if(rm)try{rm.leave()}catch(e){}};
      app.innerHTML=topbar("🙋 "+nz(name))+'<p class="msg">連線中…</p>';bindBack();
      R.join("g"+code).then(function(r){rm=r;rm.presence({role:"p",name:myName});wait("已加入！等老師開始…");
        unsub.push(rm.on("q",function(m){var d=m.data;if(!d||!d.opts)return;
          app.innerHTML=topbar("第 "+(d.n+1)+" / "+d.total+" 題・"+esc(myName))+'<div class="q">'+esc(d.q)+'</div><div class="opts">'+d.opts.map(function(o){return '<button data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join("")+'</div>';bindBack();
          app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){app.querySelectorAll("[data-o]").forEach(function(x){x.disabled=true});b.style.borderColor="var(--pri)";rm.emit("ans",{n:d.n,c:b.dataset.o,name:myName}).catch(function(){});}});}));
        unsub.push(rm.on("rev",function(m){var d=m.data;if(!d)return;var s=(d.scores&&d.scores[myName])||0;wait("正確答案：<b style='color:var(--ok)'>"+nz(d.a)+"</b><br>你的分數：<b>"+s+"</b>")}));
        unsub.push(rm.on("end",function(m){var d=m.data||{},sc=d.scores||{},arr=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]});var rank=arr.indexOf(myName)+1;wait("遊戲結束！<br>你的分數：<b>"+(sc[myName]||0)+"</b>"+(rank?"（第 "+rank+" 名）":""))}));
      
        var myPeer=null,tg=null;
        unsub.push(rm.onPeers(function(ch){(ch.peers||[]).forEach(function(p){if(p.sameTab)myPeer=p.peer})}));
        function sUI(){if($("#sv"))return;app.innerHTML=topbar("🐍 "+nz(myName))+SB.ui("");bindBack();tg=SB.draw($("#sv"))}
        unsub.push(rm.on("sst",function(m){var d=m.data;if(!d||!d.p)return;sUI();
          var ps=d.p.map(function(a){return{peer:a[0],name:a[1],pos:a[2]}});
          SB.show(tg,ps,d.c,!!d.o);
          if(d.o){SB.mkey="";SB.modal(SB.winH(d.w,false),"w")}
          else if(d.d>0&&ps[d.c]){var key=ps[d.c].name+d.d;if(SB.mkey!==key){SB.mkey=key;SB.modal(SB.diceH(ps[d.c].name,d.d),"d")}}
          else{SB.mkey="";if(SB.mk==="d")SB.modal()}}));
        unsub.push(rm.on("sq",function(m){var d=m.data;if(!d||!d.opts)return;sUI();
          if(!(d.who===myPeer||(!myPeer&&d.name===myName))){if(SB.mk==="q"||SB.mk==="r")SB.modal();return}
          SB.modal(SB.qH(d.name,d,false),"q");
          document.querySelectorAll("#sm [data-o]").forEach(function(b){b.onclick=function(){document.querySelectorAll("#sm [data-o]").forEach(function(x){x.disabled=true});b.style.borderColor="var(--pri)";rm.emit("ans",{g:"s",n:d.n,c:b.dataset.o}).catch(function(){})}})}));
        unsub.push(rm.on("sr",function(m){var d=m.data;if(!d||SB.mk!=="q")return;
          SB.modal(SB.res(d.ok,d.a),"r");setTimeout(function(){if(SB.mk==="r")SB.modal()},1500)}));
      }).catch(function(e){noRoom(e)});
    };
  });
  function wait(h){app.innerHTML=topbar("多人連線")+'<div class="q" style="font-size:28px">'+h+'</div>';bindBack()}
}
