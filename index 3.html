<script>
/* ===== 題庫（所有遊戲共用）===== */
var SEED=[["ㄇㄚ","媽"],["ㄉㄚˋ","大"],["ㄏㄠˇ","好"],["ㄕㄨㄟˇ","水"],["ㄖˋ","日"],["ㄩㄝˋ","月"],["ㄏㄨㄛˇ","火"],["ㄖㄣˊ","人"],["ㄕㄢ","山"],["ㄎㄡˇ","口"]];
var bank=[];
function loadBank(){try{var s=localStorage.getItem("bank_v1");if(s){bank=JSON.parse(s)}}catch(e){}
  if(!bank.length){bank=SEED.map(function(x){return{q:x[0],a:x[1]}})}}
function saveBank(){try{localStorage.setItem("bank_v1",JSON.stringify(bank))}catch(e){}}
loadBank();

var $=function(s){return document.querySelector(s)};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mk(item){ // 產生 4 選 1：先用題目自訂的錯誤選項，空白的再用其他題的答案補滿
  var seen={},o=[];seen[item.a]=1;
  (item.w||[]).forEach(function(w){w=String(w||"").trim();if(w&&!seen[w]&&o.length<3){seen[w]=1;o.push(w)}});
  shuf(bank.map(function(x){return x.a})).forEach(function(w){if(!seen[w]&&o.length<3){seen[w]=1;o.push(w)}});
  return{q:item.q,a:item.a,opts:shuf(o.concat([item.a]))}}
var app=$("#app"),cleanup=null;
function go(fn,a){if(cleanup){try{cleanup()}catch(e){}cleanup=null}fn(a)}
function topbar(title){return '<div class="top"><button class="ghost" id="back">← 主畫面</button><div class="sp"></div><b>'+title+'</b></div>'}
function bindBack(){var b=$("#back");if(b)b.onclick=function(){go(home)}}

/* ===== 身分、統計 ===== */
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
var role=ls("role_v1"),sname=ls("name_v1")||"";
function addStat(g,n,sc,t){var a=[];try{a=JSON.parse(ls("stats_v1")||"[]")}catch(e){}a.push({n:n,g:g,s:sc,t:t,d:Date.now()});if(a.length>1000)a=a.slice(-1000);ls("stats_v1",JSON.stringify(a))}
function addWrong(n,q,a,c){var w=[];try{w=JSON.parse(ls("wrong_v1")||"[]")}catch(e){}w.push({n:n,q:q,a:a,c:c,d:Date.now()});if(w.length>200)w=w.slice(-200);ls("wrong_v1",JSON.stringify(w))}
function setRole(r){role=r;ls("role_v1",r)}

/* ===== 首頁（選身分）===== */
function roleSel(){
  app.innerHTML='<h1>🎒 學習遊戲平台</h1><p class="sub">請選擇身分</p><div class="grid"><button class="game" id="rt"><b>👩‍🏫 老師</b><span>房間代碼、題庫、分數統計</span></button><button class="game" id="rs"><b>🧒 學生</b><span>玩遊戲</span></button></div>'+
  '<div class="card" id="nmbox" style="display:none;margin-top:12px"><b>你的名字</b><div style="height:8px"></div><input id="nmi" maxlength="8" placeholder="輸入名字" value="'+esc(sname)+'"><button id="ok" style="width:100%;margin-top:8px">開始</button></div>';
  $("#rt").onclick=function(){setRole("teacher");go(home)};
  $("#rs").onclick=function(){$("#nmbox").style.display="";$("#nmi").focus()};
  $("#ok").onclick=function(){var n=$("#nmi").value.trim();if(!n)return;sname=n;ls("name_v1",n);setRole("student");go(home)};
}
function switchBtn(){return '<button class="ghost" id="zt">注音：'+(zon?"開":"關")+'</button><button class="ghost" id="sw">切換身分</button>'}
function bindSwitch(){$("#sw").onclick=function(){role=null;ls("role_v1","");go(roleSel)};$("#zt").onclick=function(){zon=!zon;ls("zy_v1",zon?"1":"0");go(home)}}

/* ===== 主畫面 ===== */
function home(){
  if(!role){roleSel();return}
  if(role==="teacher"){
    app.innerHTML='<div class="top"><h1 style="margin:0">👩‍🏫 老師</h1><div class="sp"></div>'+switchBtn()+'</div><p class="sub">題庫共 '+bank.length+' 題・所有遊戲共用</p>'+
    '<div class="grid"><button class="game" id="th"><b>🏠 房間代碼</b><span>開房間，讓學生用房號加入（選擇題搶答、蛇棋）</span></button>'+
    '<button class="game" id="tb"><b>📚 題庫</b><span>新增、刪除、匯入題目</span></button>'+
    '<button class="game" id="ts"><b>📊 分數統計</b><span>每位學生的成績紀錄</span></button></div>';
    bindSwitch();$("#th").onclick=function(){go(host)};$("#tb").onclick=function(){go(bankEd)};$("#ts").onclick=function(){go(statsView)};
    return;
  }
  app.innerHTML='<div class="top"><h1 style="margin:0">🧒 '+nz(sname)+'</h1><div class="sp"></div>'+switchBtn()+'</div><h2>遊戲</h2><div class="grid">'+
  '<button class="game" id="g1"><b>🎯 選擇題挑戰</b><span>看題目，選出正確答案</span></button>'+
  '<button class="game" id="g2"><b>🃏 翻牌配對</b><span>國字配注音、注音配國字</span></button>'+
  '<button class="game" id="g4"><b>🏝️ 魯濱遜漂流記</b><span>單人卡牌生存，活過 14 回合</span></button>'+
  '<button class="game" id="g5"><b>🏝️ 魯濱遜漂流記・多人版</b><span>同一台平板輪流，2–14 人，合作求生</span></button>'+
  '<button class="game" id="g6"><b>🎨 白板</b><span>用手指或滑鼠自由畫畫</span></button>'+
  '<button class="game" id="gj"><b>🙋 多人連線</b><span>輸入老師的房號加入（選擇題搶答、蛇棋、戳戳樂）</span></button></div>';
  bindSwitch();
  $("#g1").onclick=function(){go(quiz)};$("#g2").onclick=function(){go(memory)};$("#g4").onclick=function(){go(robinson)};$("#g5").onclick=function(){go(robinson2)};$("#g6").onclick=function(){go(whiteboard)};$("#gj").onclick=function(){go(join)};
}

/* ===== 分數統計（老師）===== */
function statsView(){
  var a=[];try{a=JSON.parse(ls("stats_v1")||"[]")}catch(e){}
  var m={};a.forEach(function(r){var o=m[r.n]||(m[r.n]={n:r.n,p:0,qs:0,qt:0,sw:0,mp:0});o.p++;
    if(r.g==="quiz"){o.qs+=r.s;o.qt+=r.t}else if(r.g==="snake")o.sw+=r.s;else if(r.g==="memory")o.mp+=r.s});
  var rows=Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.qs-x.qs});
  var wl=[];try{wl=JSON.parse(ls("wrong_v1")||"[]")}catch(e){}wl=wl.slice(-20).reverse();
  app.innerHTML=topbar("📊 分數統計")+'<div class="card">'+(rows.length?'<table><tr><td><b>名字</b></td><td><b>選擇題</b></td><td><b>蛇棋勝</b></td><td><b>翻牌</b></td></tr>'+
    rows.map(function(o){return '<tr><td>'+nz(o.n)+'</td><td style="text-align:left;font-weight:400">'+o.qs+' / '+o.qt+(o.qt?'（'+Math.round(o.qs/o.qt*100)+'%）':'')+'</td><td style="text-align:left;font-weight:400">'+o.sw+'</td><td style="text-align:left;font-weight:400">'+o.mp+'</td></tr>'}).join("")+'</table>':'<p class="msg">還沒有紀錄。開一場連線遊戲就會出現。</p>')+'</div>'+
    '<p class="msg" style="font-size:14px">只統計這台平板上的紀錄（你開的連線遊戲＋本機遊戲）。</p>'+
    '<div class="card" style="margin-top:12px"><b>錯題紀錄（最新在前）</b>'+(wl.length?wl.map(function(w){return '<div style="padding:5px 0;border-bottom:1px solid var(--line)">'+nz(w.n)+'：'+nz(w.q)+' → 選了 '+nz(w.c)+'，正確答案 '+nz(w.a)+'</div>'}).join(""):'<p class="msg">還沒有錯題。</p>')+'</div>'+((rows.length||wl.length)?'<div class="row" style="margin-top:12px"><button class="ghost" id="clr">清除全部紀錄</button></div>':'');
  bindBack();var c=$("#clr");if(c)c.onclick=function(){if(confirm("要清除全部紀錄嗎？")){ls("stats_v1","[]");ls("wrong_v1","[]");statsView()}};
}

/* ===== 題庫管理 ===== */
function bankEd(){
  function draw(){
    app.innerHTML=topbar("📚 題庫管理")+
    '<div class="card"><div class="row"><input id="nq" placeholder="題目（例：ㄇㄚ）"><input id="na" placeholder="答案（例：媽）"></div><p class="sub" style="font-size:15px;margin:4px 0">錯誤選項（可空白，空白會自動用其他題的答案補成 4 選 1）</p><div class="row"><input id="nw1" placeholder="錯誤選項 1"><input id="nw2" placeholder="錯誤選項 2"><input id="nw3" placeholder="錯誤選項 3"></div><button id="add" style="width:100%">＋ 新增</button></div>'+
    '<div class="card" style="margin-top:12px"><b>批次匯入</b><p class="sub" style="font-size:15px;margin:4px 0">每行一題：題目,答案,錯誤選項1,錯誤選項2,錯誤選項3（後三欄可空白）</p><textarea id="bulk" rows="3"></textarea><button id="imp" style="margin-top:8px">匯入</button> <button class="ghost" id="rst">還原預設題庫</button></div>'+
    '<div class="card" style="margin-top:12px"><b>目前題目（'+bank.length+'）</b>'+bank.map(function(b,i){return '<div class="item"><span>'+esc(b.q)+' → '+esc(b.a)+((b.w&&b.w.some(function(x){return x}))?'（'+esc(b.w.filter(function(x){return x}).join('、'))+'）':'')+'</span><button class="ghost" data-i="'+i+'">刪除</button></div>'}).join("")+'</div>';
    bindBack();
    $("#add").onclick=function(){var q=$("#nq").value.trim(),a=$("#na").value.trim();if(q&&a){var w=[$("#nw1").value,$("#nw2").value,$("#nw3").value].map(function(x){return x.trim()}),it={q:q,a:a};if(w.some(function(x){return x}))it.w=w;bank.push(it);saveBank();draw()}};
    $("#imp").onclick=function(){$("#bulk").value.split(/\n/).forEach(function(l){var p=l.split(/[,，\t]/);if(p.length>=2&&p[0].trim()&&p[1].trim()){var it={q:p[0].trim(),a:p[1].trim()},w=p.slice(2,5).map(function(x){return x.trim()});if(w.some(function(x){return x}))it.w=w;bank.push(it)}});saveBank();draw()};
    $("#rst").onclick=function(){if(confirm("要還原成預設題庫嗎？")){bank=SEED.map(function(x){return{q:x[0],a:x[1]}});saveBank();draw()}};
    app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){bank.splice(+b.dataset.i,1);saveBank();draw()}});
  }
  draw();
}


/* ===== 單人：白板 ===== */
function whiteboard(){
  var stamp="",cols=["#2b2b2b","#e53935","#f08a24","#fdd835","#43a047","#1e88e5","#8e24aa","#ffffff"],col=cols[0],sz=6,hist=[];
  app.innerHTML=topbar("🎨 白板")+'<div class="row" style="flex-wrap:wrap;gap:6px;margin:8px 0">'+
    cols.map(function(c,i){return '<button class="wbc" data-c="'+c+'" title="'+(i==7?"橡皮擦":"")+'" style="width:34px;height:34px;padding:0;border-radius:50%;background:'+c+';border:3px solid '+(i?"#ddd":"#f08a24")+'">'+(i==7?"🧽":"")+'</button>'}).join("")+
    '<select id="wbs"><option value="3">細</option><option value="6" selected>中</option><option value="14">粗</option><option value="30">特粗</option></select>'+
    '<button class="sec" id="wbu">↩️ 復原</button><button class="sec" id="wbx">🗑️ 清除</button><select id="wbe"><option value="">🖌️ 畫筆</option>'+["⭐","❤️","😀","👍","🌸","🐱","🍎","🎉","✅","💯"].map(function(e){return '<option value="'+e+'">印章 '+e+'</option>'}).join("")+'</select></div>'+
    '<canvas id="wb" style="width:100%;height:65vh;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.1);touch-action:none;display:block"></canvas>';
  bindBack();
  var cv=$("#wb"),cx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  function fit(){var r=cv.getBoundingClientRect(),img=cv.width?cx.getImageData(0,0,cv.width,cv.height):null;cv.width=r.width*dpr;cv.height=r.height*dpr;cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);if(img)cx.putImageData(img,0,0)}
  fit();
  function save(){hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>30)hist.shift()}
  var down=false,lx,ly;
  function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]}
  cv.onpointerdown=function(e){save();if(stamp){var q=pt(e),f=Math.max(sz*5,40)*dpr;cx.font=f+"px sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(stamp,q[0],q[1]);return}down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);lx=p[0];ly=p[1];cx.beginPath();cx.arc(lx,ly,sz*dpr/2,0,7);cx.fillStyle=col;cx.fill()};
  cv.onpointermove=function(e){if(!down)return;var p=pt(e);cx.strokeStyle=col;cx.lineWidth=sz*dpr;cx.lineCap="round";cx.lineJoin="round";cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(p[0],p[1]);cx.stroke();lx=p[0];ly=p[1]};
  cv.onpointerup=cv.onpointercancel=function(){down=false};
  app.querySelectorAll(".wbc").forEach(function(b){b.onclick=function(){col=b.dataset.c;app.querySelectorAll(".wbc").forEach(function(x){x.style.borderColor="#ddd"});b.style.borderColor="#f08a24";stamp="";$("#wbe").value=""}});
  $("#wbe").onchange=function(){stamp=this.value};
  $("#wbs").onchange=function(){sz=+this.value};
  $("#wbu").onclick=function(){if(hist.length)cx.putImageData(hist.pop(),0,0)};
  $("#wbx").onclick=function(){save();cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height)};
  window.addEventListener("resize",fit);cleanup=function(){window.removeEventListener("resize",fit)};
}

/* ===== 單人：選擇題 ===== */
function quiz(){
  if(bank.length<4){app.innerHTML=topbar("🎯")+'<p class="msg">題庫至少要 4 題才能玩。</p>';bindBack();return}
  var qs=shuf(bank).slice(0,10).map(mk),i=0,score=0,lock=false;
  function show(){
    if(i>=qs.length){addStat("quiz",sname||"本機",score,qs.length);app.innerHTML=topbar("🎯 結果")+'<div class="big">'+score+' / '+qs.length+'</div><p class="msg">'+(score===qs.length?"太棒了！全對！🎉":"繼續加油！")+'</p><div class="row"><button id="again">再玩一次</button></div>';bindBack();$("#again").onclick=function(){go(quiz)};return}
    var q=qs[i];lock=false;
    app.innerHTML=topbar("🎯 第 "+(i+1)+" / "+qs.length+" 題・得分 "+score)+'<div class="q">'+esc(q.q)+'</div><div class="opts">'+q.opts.map(function(o){return '<button data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join("")+'</div>';
    bindBack();
    app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){if(lock)return;lock=true;var ok=b.dataset.o===q.a;if(ok)score++;b.classList.add(ok?"ok":"bad");if(!ok)app.querySelectorAll("[data-o]").forEach(function(x){if(x.dataset.o===q.a)x.classList.add("ok")});setTimeout(function(){i++;show()},900)}});
  }
  show();
}

/* ===== 單人：翻牌配對 ===== */
function isZy(t){return /^[\u3105-\u3129\u02ca\u02c7\u02cb\u02d9\s]+$/.test(t)&&/[\u3105-\u3129]/.test(t)}
function isHan(t){return /[\u4e00-\u9fff]/.test(t)&&!/[\u3105-\u3129]/.test(t)}
function memory(){
  var pool=bank.filter(function(b){return(isZy(b.q)&&isHan(b.a))||(isHan(b.q)&&isZy(b.a))}); // 只用「國字配注音」或「注音配國字」的題目
  if(pool.length<2){app.innerHTML=topbar("🃏")+'<p class="msg">題庫裡要有至少 2 題「國字配注音」或「注音配國字」的題目才能玩。</p>';bindBack();return}
  var pick=shuf(pool).slice(0,6),cards=[];
  pick.forEach(function(p,k){cards.push({k:k,t:p.q});cards.push({k:k,t:p.a})});
  cards=shuf(cards);var open=[],found=0,moves=0,busy=false;
  function draw(){
    app.innerHTML=topbar("🃏 翻牌配對・"+moves+" 步")+'<div class="mem">'+cards.map(function(c,i){var cl=c.done?"mc done":(open.indexOf(i)>=0?"mc up":"mc");return '<button class="'+cl+'" data-i="'+i+'">'+((c.done||open.indexOf(i)>=0)?esc(c.t):"？")+'</button>'}).join("")+'</div>'+(found===pick.length?'<p class="msg">🎉 全部配對成功！</p><div class="row"><button id="again">再玩一次</button></div>':"");
    bindBack();var a=$("#again");if(a)a.onclick=function(){go(memory)};
    app.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){var i=+b.dataset.i;if(busy||cards[i].done||open.indexOf(i)>=0)return;open.push(i);draw();
      if(open.length===2){moves++;busy=true;var x=cards[open[0]],y=cards[open[1]];setTimeout(function(){if(x.k===y.k&&x.t!==y.t||(x.k===y.k)){x.done=y.done=true;found++;if(found===pick.length)addStat("memory",sname||"本機",1,1)}open=[];busy=false;draw()},900)}}});
  }
  draw();
}

/* ===== 蛇棋棋盤（單機與多人連線共用）===== */
var SB={C:["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#0aa6b8","#d2308f","#7a9a01","#9a6324","#808000","#000075","#e6a700","#5a5a5a","#e8607a"],
 SK:{16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD:{1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100},NS:"http://www.w3.org/2000/svg",mk:"",mkey:""};
SB.xy=function(n){var r=Math.floor((n-1)/10),c=(n-1)%10;if(r%2)c=9-c;return{x:c*60+30,y:(9-r)*60+30}};
SB.el=function(tag,at,par){var e=document.createElementNS(SB.NS,tag);for(var k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e};
SB.draw=function(s){
  s.innerHTML="";var el=SB.el,xy=SB.xy;
  el("rect",{x:0,y:600,width:600,height:40,fill:"var(--c2)"},s);
  var t=el("text",{x:8,y:625,"font-size":12,fill:"var(--mute)"},s);t.textContent="起點";
  for(var n=1;n<=100;n++){var p=xy(n);
    el("rect",{x:p.x-30,y:p.y-30,width:60,height:60,fill:((Math.floor((n-1)/10)+(n-1)%10)%2)?"var(--c1)":"var(--c2)",stroke:"var(--line)"},s);
    var tx=el("text",{x:p.x-27,y:p.y-18,"font-size":11,fill:"var(--mute)"},s);tx.textContent=n}
  for(var a in SB.LD){var A=xy(+a),B=xy(SB.LD[a]);
    var dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy*7,py=ux*7,st="#a0702d";
    el("line",{x1:A.x+px,y1:A.y+py,x2:B.x+px,y2:B.y+py,stroke:st,"stroke-width":4,"stroke-linecap":"round"},s);
    el("line",{x1:A.x-px,y1:A.y-py,x2:B.x-px,y2:B.y-py,stroke:st,"stroke-width":4,"stroke-linecap":"round"},s);
    for(var d=14;d<L-6;d+=18)el("line",{x1:A.x+ux*d+px,y1:A.y+uy*d+py,x2:A.x+ux*d-px,y2:A.y+uy*d-py,stroke:st,"stroke-width":3},s)}
  var k=0;
  for(var a2 in SB.SK){var A2=xy(+a2),B2=xy(SB.SK[a2]);

  else if(s.wood<cost){ok=false;log.push(`行動失敗:木頭不足(需要 ${cost},目前 ${s.wood}),未扣除木頭`)}}
 else if(action.wood<0&&s.wood<-action.wood){ok=false;log.push(`行動失敗:木頭不足(需要 ${-action.wood},目前 ${s.wood}),未扣除木頭`)}
 if(ok){
  s.food+=action.food;s.wood+=action.wood;s.hp=Math.min(CONFIG.maxHp,s.hp+action.hp);
  const p=[];if(action.food)p.push(`${action.food>0?'+':''}${action.food}🍖`);if(action.wood)p.push(`${action.wood>0?'+':''}${action.wood}🪵`);if(action.hp)p.push(`${action.hp>0?'+':''}${action.hp}❤️`);
  log.push(`行動「${action.title}」:${p.join(' ')||'無變化'}`);
  if(action.build){const L=CONFIG.shelter[action.build-1];const add=L.uses-s.max;s.lv=action.build;s.max=L.uses;s.uses+=add;log.push(`建造 Lv.${s.lv} ${L.name},避難所 ${s.uses} / ${s.max}`)}
 }
 if(s.hp<=0)return{s,log,dead:true};
 // 事件
 s.food=Math.max(0,s.food+event.food);s.wood=Math.max(0,s.wood+event.wood);
 const p=[];if(event.food)p.push(`${event.food>0?'+':''}${event.food}🍖`);if(event.wood)p.push(`${event.wood>0?'+':''}${event.wood}🪵`);
 let dmg=-event.hp;
 if(event.hp>0){s.hp=Math.min(CONFIG.maxHp,s.hp+event.hp);p.push(`+${event.hp}❤️`)}
 else if(dmg>0){let ab=0;
  if(event.shelter&&s.uses>0){ab=Math.min(dmg,s.uses);s.uses-=ab;log.push(`🏕️ 避難所抵銷 ${ab} ❤️ 傷害(消耗 ${ab} 次,剩餘 ${s.uses} / ${s.max})`)}
  else if(event.shelter)log.push(`🏕️ 避難所已無使用次數,無法抵銷`);
  else log.push(`此事件傷害無法由避難所抵銷`);
  s.hp-=dmg-ab;if(dmg-ab>0)p.push(`-${dmg-ab}❤️`)}
 log.push(`事件「${event.title}」:${p.join(' ')||'無資源變化'}`);
 if(s.hp<=0)return{s,log,dead:true};
 // 食物消耗
 if(s.food>0){s.food--;log.push(`食物消耗:-1🍖`)}else{s.hp--;log.push(`食物不足:-1❤️(避難所無法抵銷)`)}
 return{s,log,dead:s.hp<=0};
}
function simulate(actions,events){
 let win=0;const total=2**CONFIG.rounds;
 (function go(r,s){
  if(r===CONFIG.rounds){win++;return}
  for(let i=0;i<2;i++){const o=playRound(s,actions[r][i],events[r]);if(!o.dead)go(r+1,o.s)}
 })(0,newState());
 return{win,total,rate:win/total};
}
function strategies(actions,events){ // 固定策略結果
 const run=pick=>{let s=newState();for(let r=0;r<CONFIG.rounds;r++){const o=playRound(s,actions[r][pick(r,s)],events[r]);s=o.s;if(o.dead)return`失敗於第${r+1}回合`}return"勝利"};
 return{全選A:run(()=>0),全選B:run(()=>1),
  食物優先:run((r)=>actions[r][0].food>=actions[r][1].food?0:1),
  木頭優先:run((r)=>actions[r][0].wood>=actions[r][1].wood?0:1),
  能建就建:run((r,s)=>actions[r][1].build&&s.lv===actions[r][1].build-1&&s.wood>=-actions[r][1].wood?1:(actions[r][0].food>=actions[r][1].food?0:1))};
}

var roomApi=null,myId=(window.crypto&&crypto.randomUUID?crypto.randomUUID():"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
function getRoom(cb){
  if(roomApi){cb(roomApi);return}
  var C=window.GAME_CONFIG||{};window.__roomErr="";
  if(!C.SUPABASE_URL||!C.SUPABASE_KEY){window.__roomErr="config.js 沒有載入或沒有填入設定";cb(null);return}
  if(!window.supabase||!supabase.createClient){window.__roomErr="supabase.js 沒有載入";cb(null);return}
  var client;
  try{client=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:30}}})}catch(e){window.__roomErr="createClient 失敗："+e.message;cb(null);return}
  roomApi={join:function(name){return new Promise(function(res,rej){
    var ch=client.channel("room-"+name,{config:{broadcast:{self:false,ack:false},presence:{key:myId}}}),
        handlers={},peerFns=[],ok=false,tm=null;
    ch.on("broadcast",{event:"m"},function(p){var d=p&&p.payload;if(!d||!d.t)return;(handlers[d.t]||[]).slice().forEach(function(f){try{f({data:d.d,peer:d.f})}catch(e){console.error(e)}})});
    ch.on("presence",{event:"sync"},function(){
      var st=ch.presenceState(),peers=[];
      Object.keys(st).forEach(function(k){var arr=st[k]||[],pr=arr[arr.length-1]||{};peers.push({peer:k,presence:pr,sameTab:k===myId})});
      peerFns.slice().forEach(function(f){try{f({peers:peers})}catch(e){console.error(e)}})});
    var room={
      emit:function(t,d){return ch.send({type:"broadcast",event:"m",payload:{t:t,d:d,f:myId}})},
      on:function(t,f){(handlers[t]=handlers[t]||[]).push(f);return function(){handlers[t]=(handlers[t]||[]).filter(function(x){return x!==f})}},
      onPeers:function(f){peerFns.push(f);return function(){peerFns=peerFns.filter(function(x){return x!==f})}},
      presence:function(o){setTimeout(function(){try{ch.track(o)}catch(e){}},Math.random()*2000)}, // 錯開加入時間，避免多人同時加入超過速率限制
      leave:function(){try{ch.unsubscribe()}catch(e){}}};
    tm=setTimeout(function(){if(!ok){try{ch.unsubscribe()}catch(e){}rej(new Error("timeout"))}},10000);
    ch.subscribe(function(status,err){
      if(status==="SUBSCRIBED"&&!ok){ok=true;clearTimeout(tm);res(room)}
      else if(!ok&&(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED")){clearTimeout(tm);rej(new Error(status+(err&&err.message?"："+err.message:"")))}});
  })}};
  cb(roomApi);
}

        else if(t==="h"){hf++;zones=zones.concat(G0.hintAreas[i]);opened[i]=["h","",c,g];ev={k:"hint",e:"💡",name:pl.name,txt:G0.hintTexts[i]};msg=pl.name+" 找到提示！"}

        else if(danger[i]){opened[i]=["d","",c,0];msg=pl.name+"：❗ 這格周圍八格有炸彈"}

        msg=win?"🏆 全部獎品都找到了！":"💥 所有玩家都出局了";sync();
        var d={w:win?1:0,r:r,dd:dd};rm.emit("pend",d);SB.modal(PK.endH(d),"w");$("#pkx").onclick=function(){SB.modal()}}
      $("#sk").onclick=function(){if(over||ph==="w")return;ph="w";q=null;qn++;SB.modal();msg=P[c].name+" 被跳過";sync();nextTurn(300)};
      sync();turn();
    }
    function startSnake(){
      mode="snake";
      var P=Object.keys(players).map(function(k){return{peer:k,name:players[k],pos:0}}),dup={};
      P.forEach(function(x){dup[x.name]=(dup[x.name]||0)+1;if(dup[x.name]>1)x.name+=dup[x.name]});

      bindBack();var tg=SB.draw($("#sv"));

      function next(){c=(c+1)%P.length;setTimeout(turn,1500)}
      function turn(){
        if(over)return;
        var k=0;while(k<P.length&&!live[P[c].peer]){c=(c+1)%P.length;k++}
        if(k>=P.length){SB.modal('<div style="font-size:24px">目前沒有連線的玩家</div>',"r");sync();return}
        busy=false;d=0;q=mk(bank[Math.floor(Math.random()*bank.length)]);qn++;
        rm.emit("sq",{n:qn,who:P[c].peer,name:P[c].name,q:q.q,opts:q.opts});
        sync();SB.modal(SB.qH(P[c].name,q,true),"q");
      }
      unsub.push(rm.on("ans",function(m){
        if(mode!=="snake"||over||busy||!q||!m.data||m.data.g!=="s"||m.data.n!==qn||m.peer!==P[c].peer)return;
        busy=true;var ok=m.data.c===q.a,qa=q.a,qt=q.q,who=P[c].name;q=null;
        rm.emit("sr",{n:qn,ok:ok?1:0,a:qa});
        if(ok)okWait(who,qa);
        else{addWrong(who,qt,m.data.c,qa);SB.modal(SB.wrongH(who,qt,m.data.c,qa),"w");
          $("#wk").onclick=function(){SB.modal();next()};
          $("#wok").onclick=function(){waitRoll=true;SB.modal();rm.emit("sr",{n:qn,ok:1,t:1,a:qa})}}  // 老師判定答對：學生直接出現骰子畫面
      }));
      function okWait(who,qa){ // 學生答對：老師按「OK」後，學生才出現骰子畫面
        SB.modal(SB.res(true,qa)+'<div style="margin:6px 0">'+nz(who)+' 答對了</div><div class="row"><button id="okb">OK</button></div>',"r");
        $("#okb").onclick=function(){waitRoll=true;SB.modal();rm.emit("dg",{n:qn})}}
      unsub.push(rm.on("rl",function(m){if(mode!=="snake"||!waitRoll||over||!m.data||m.data.n!==qn||m.peer!==P[c].peer)return;waitRoll=false;roll()}));
      async function roll(){
        waitRoll=false;var pl=P[c],dd=1+Math.floor(Math.random()*6);d=dd;sync();SB.modal(SB.diceH(pl.name,dd),"d");SB.rollDice(dd,1100);
        await new Promise(function(r){setTimeout(r,1250)});
        var stp=0,won=await SB.move(pl,dd,function(m){sync(!!(++stp%4));var e=document.getElementById("sdm");if(e&&m)e.textContent=m});
        d=0;
        if(won){over=true;w=pl.name;P.forEach(function(x){addStat("snake",x.name,x===pl?1:0,1)});sync();SB.modal(SB.winH(pl.name,true),"w");$("#ag").onclick=function(){go(host)};return}
        sync();SB.modal();
        if(dd===6)setTimeout(turn,1500);else next();
      }
      $("#sk").onclick=function(){if(over||(busy&&!waitRoll))return;waitRoll=false;busy=true;q=null;qn++;SB.modal();next()};
      sync();turn();
    }
  });
}
